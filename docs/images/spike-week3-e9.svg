<text x="419.3" y="367.0" font-size="12.5" fill="#0f172a" font-weight="bold" text-anchor="start">-1.1</text>
<text x="24.0" y="434.0" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">Blue: app alone. The GPU runs 3.5–6.6% faster clocks when it is paused part of the time (measured),</text>
<text x="24.0" y="450.0" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">so the app does more work in its share of time. Green: a busy neighbour keeps the clock steady, and the cap holds.</text>
</svg>
