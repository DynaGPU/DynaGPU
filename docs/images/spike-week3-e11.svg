<svg xmlns="http://www.w3.org/2000/svg" width="800" height="322" viewBox="0 0 800 322" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="800" height="322" rx="12" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="start">A 2-GPU job only runs at its share if both GPUs switch together</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="start">NCCL all-reduce rate vs the GPUs alone; each GPU also runs a busy app. Target 70%. 2 × NVIDIA L40S</text>
<line x1="316.0" y1="76" x2="316.0" y2="282" stroke="#eef2f7"/>
<text x="316.0" y="298.0" font-size="11.5" fill="#475569" font-weight="normal" text-anchor="middle">0%</text>
<line x1="412.0" y1="76" x2="412.0" y2="282" stroke="#eef2f7"/>
<text x="412.0" y="298.0" font-size="11.5" fill="#475569" font-weight="normal" text-anchor="middle">25%</text>
<line x1="508.0" y1="76" x2="508.0" y2="282" stroke="#eef2f7"/>
<text x="508.0" y="298.0" font-size="11.5" fill="#475569" font-weight="normal" text-anchor="middle">50%</text>
<line x1="604.0" y1="76" x2="604.0" y2="282" stroke="#eef2f7"/>
<text x="604.0" y="298.0" font-size="11.5" fill="#475569" font-weight="normal" text-anchor="middle">75%</text>
<line x1="700.0" y1="76" x2="700.0" y2="282" stroke="#eef2f7"/>
<text x="700.0" y="298.0" font-size="11.5" fill="#475569" font-weight="normal" text-anchor="middle">100%</text>
<line x1="584.8" y1="76" x2="584.8" y2="282" stroke="#dc2626" stroke-dasharray="5,4" stroke-width="1.5"/>
<text x="588.8" y="72.0" font-size="11.5" fill="#dc2626" font-weight="normal" text-anchor="start">target 70%</text>
<text x="24.0" y="104.0" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="start">Both GPUs to itself</text>
<rect x="316" y="90" width="384.0" height="22" rx="3" fill="#94a3b8"/>
<text x="708.0" y="106.0" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="start">100.0%</text>
<text x="24.0" y="148.0" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="start">Shared 70/30, each GPU's own turns</text>
<rect x="316" y="134" width="133.7" height="22" rx="3" fill="#94a3b8"/>
<text x="457.7" y="150.0" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="start">34.8%</text>
<text x="24.0" y="192.0" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="start">Shared 70/30, agent slots 50 ms apart</text>
<rect x="316" y="178" width="160.6" height="22" rx="3" fill="#94a3b8"/>
<text x="484.6" y="194.0" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="start">41.8%</text>
<text x="24.0" y="236.0" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="start">Shared 70/30, agent slots aligned</text>
<rect x="316" y="222" width="268.2" height="22" rx="3" fill="#16a34a"/>
<text x="592.2" y="238.0" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="start">69.8%</text>
</svg>
